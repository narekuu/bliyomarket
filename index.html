
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#168bd8">
<title>BLIYO MARKET</title>
<link rel="icon" href="https://www.image2url.com/r2/default/files/1795010170495-9c6bcbc0-665b-4557-bc88-6281419aad43.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
--bg:#edf2f8;--card:rgba(255,255,255,.63);--glass:rgba(255,255,255,.48);
--glass-strong:rgba(255,255,255,.72);--text:#202b3a;--muted:#8190a2;
--line:rgba(255,255,255,.72);--accent:#526b88;
--shadow:0 12px 40px rgba(35,50,70,.10);--green:#269b70;--red:#d65e69;--blur:26px;
}
body.dark{
--bg:#101722;--card:rgba(34,45,61,.72);--glass:rgba(35,47,64,.58);
--glass-strong:rgba(35,47,64,.82);--text:#f0f3f8;--muted:#a2afbf;
--line:rgba(255,255,255,.12);--accent:#b1c6df;--shadow:0 12px 40px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
font-family:Inter,sans-serif;
background:radial-gradient(ellipse at 5% 0%,rgba(126,190,224,.27),transparent 45%),
radial-gradient(ellipse at 100% 80%,rgba(139,171,207,.23),transparent 45%),var(--bg);
color:var(--text);min-height:100vh;transition:background .3s,color .3s;
}
body,button,input,textarea{font-family:Inter,sans-serif}
button{cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%}
.app{max-width:1150px;margin:auto;padding:71px 17px 110px;min-height:100vh}
.glass{
background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(180%);
-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 1px rgba(255,255,255,.45);
}
.topbar-backplate{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:calc(100% - 34px);max-width:1116px;height:63px;border-radius:22px;z-index:39;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 48%,rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.24);box-shadow:none!important;-webkit-backdrop-filter:blur(18px) saturate(145%);backdrop-filter:blur(18px) saturate(145%);opacity:1;visibility:visible;transition:opacity .7s cubic-bezier(.22,1,.36,1),visibility 0s linear 0s}
.topbar{height:63px;padding:0 17px;border-radius:25px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:8px;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 34px));max-width:1116px;z-index:40;box-shadow:none!important}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2px;font-size:15px}
.brand img{width:37px;height:37px;object-fit:contain;border-radius:10px}
.actions{display:flex;gap:9px}
.iconbtn{width:41px;height:41px;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:15px;display:grid;place-items:center;transition:.25s}
.iconbtn:active{transform:scale(.9)}
main{padding-top:25px;min-height:70vh}
h1,h2,h3{letter-spacing:-.7px}
.muted{color:var(--muted);font-size:12px;line-height:1.7}
.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:800;color:var(--muted)}
.page-title{font-size:29px;margin-bottom:8px}
.section{margin-top:28px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}
.section-head h2{font-size:19px}
.link{border:0;background:none;color:var(--accent);font-size:12px;font-weight:700}
.banner-wrap{margin-top:23px;border-radius:24px;overflow:hidden;position:relative}
.banner-link{display:block;width:100%;height:100%;text-decoration:none;color:inherit}
.banner{height:200px;width:100%;object-fit:cover;display:block;background:var(--card)}
.banner-content{width:100%;height:200px;display:grid;place-items:center;color:var(--muted)}
.banner-transition{animation:bannerIn .65s cubic-bezier(.2,.7,.2,1) both}
.banner-out{animation:bannerOut .22s ease both}
@keyframes bannerIn{from{opacity:0;transform:scale(1.035);filter:blur(5px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes bannerOut{to{opacity:0;transform:scale(.985);filter:blur(4px)}}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dot{width:7px;height:7px;border-radius:10px;background:var(--muted);border:0;padding:0}
.dot.active{width:20px;background:var(--accent)}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.category{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:16px 5px;text-align:center;transition:.25s}
.category:active,.product:active{transform:scale(.97)}
.cat-icon{width:43px;height:43px;border-radius:15px;background:var(--glass-strong);display:grid;place-items:center;margin:0 auto 10px;color:var(--accent)}
.category span{font-size:10px;font-weight:700}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:21px;overflow:hidden;transition:transform .25s,box-shadow .25s;box-shadow:0 7px 25px rgba(35,50,70,.05)}
.product-image{height:160px;background:var(--bg)}
.product-image img{width:100%;height:100%;object-fit:cover;display:block}
.product-info{padding:14px}
.product-info h3{font-size:13px;margin:8px 0}
.product-description{color:var(--muted);font-size:11px;line-height:1.65;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
.product-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;gap:5px}
.price{font-size:17px;font-weight:800;margin-top:10px}
.primary{background:linear-gradient(135deg,#354c67,#829bb7);color:white;border:0;border-radius:15px;padding:13px 17px;font-size:12px;font-weight:800;transition:.2s;box-shadow:0 5px 15px rgba(65,91,120,.16)}
.primary:active{transform:scale(.97)}
.buy{width:100%;margin-top:12px}
.btn{background:var(--glass);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font-size:12px;font-weight:700;backdrop-filter:blur(15px)}
.danger{color:var(--red)}
.field{margin-top:15px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}
.field input,.field textarea,.search{width:100%;padding:13px;background:var(--glass-strong);color:var(--text);border:1px solid var(--line);border-radius:14px;outline:none;font-size:13px}
.field textarea{min-height:90px;resize:vertical}
.password-wrap{position:relative}.password-wrap input{padding-right:76px}.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-size:11px;font-weight:800;padding:8px;border-radius:9px}.password-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field input:focus,.field textarea:focus,.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(100,130,160,.12)}
.bottomnav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 22px));padding:8px;display:grid;grid-template-columns:repeat(5,1fr);border-radius:27px;z-index:30;isolation:isolate;overflow:hidden;background:rgba(250,251,255,.48);backdrop-filter:blur(30px) saturate(145%);-webkit-backdrop-filter:blur(30px) saturate(145%);border:1px solid rgba(255,255,255,.76);box-shadow:0 12px 38px rgba(25,45,70,.13),inset 0 1.5px 1px rgba(255,255,255,.92),inset 0 -1px 1px rgba(255,255,255,.28)}
body.dark .bottomnav{background:rgba(18,27,40,.58);backdrop-filter:blur(30px) saturate(135%);-webkit-backdrop-filter:blur(30px) saturate(135%);border-color:rgba(255,255,255,.22);box-shadow:0 14px 42px rgba(0,0,0,.34),inset 0 1.5px 1px rgba(255,255,255,.24),inset 0 -1px 1px rgba(255,255,255,.06)}
.bottomnav:before{content:"";position:absolute;inset:0 12% auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);pointer-events:none;z-index:0}
.bottomnav:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(155deg,rgba(255,255,255,.2),transparent 38%,rgba(255,255,255,.04));pointer-events:none;z-index:0}
.nav-indicator{position:absolute;z-index:1;top:4px;bottom:4px;left:0;width:0;border-radius:21px;background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.48) 55%,rgba(235,240,248,.34));border:1px solid rgba(255,255,255,.82);box-shadow:0 4px 14px rgba(35,45,60,.09),inset 0 1px 1px rgba(255,255,255,.98),inset 0 -1px 2px rgba(110,120,140,.08);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);pointer-events:none;transform:translateX(var(--indicator-x,4px));transition:transform .76s cubic-bezier(.22,.8,.25,1),width .68s cubic-bezier(.22,.8,.25,1);will-change:transform,width;overflow:hidden}
.nav-indicator:after{content:"";position:absolute;top:-35%;bottom:-35%;left:-45%;width:34%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.78),transparent);filter:blur(3px);opacity:0;pointer-events:none}
.nav-indicator.bubble-bounce{animation:navBubbleSquish .76s cubic-bezier(.2,.85,.25,1) both}
.nav-indicator.bubble-bounce:after{animation:navBubbleShine .76s ease-out both}
@keyframes navBubbleSquish{0%{scale:1 1}24%{scale:1.13 .88}48%{scale:.94 1.09}70%{scale:1.035 .97}86%{scale:.99 1.015}100%{scale:1 1}}
@keyframes navBubbleShine{0%{left:-45%;opacity:0}18%{opacity:.9}75%{opacity:.45}100%{left:125%;opacity:0}}
body.dark .nav-indicator{background:linear-gradient(145deg,rgba(245,247,252,.22),rgba(210,218,230,.10) 55%,rgba(255,255,255,.05));border-color:rgba(255,255,255,.25);box-shadow:0 4px 18px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.28),inset 0 -1px 2px rgba(255,255,255,.06)}
.navitem{position:relative;z-index:2;background:none;border:0;color:var(--muted);display:flex;align-items:center;flex-direction:column;gap:4px;font-size:10px;padding:8px 0;font-weight:700;transition:color .28s,transform .28s}
.navitem svg{position:relative;z-index:1;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.navitem.active{color:var(--accent)}
.navitem.active svg{transform:translateY(-2px) scale(1.12)}
.navitem.active:after{content:none}
@keyframes navIndicator{from{transform:scaleX(.2);opacity:0}to{transform:scaleX(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.nav-indicator,.navitem,.navitem svg{transition:none!important;animation:none!important}}
.panel{background:var(--card);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:23px;padding:19px;box-shadow:var(--shadow)}
.profile-cover{height:150px;background:linear-gradient(130deg,#293d56,#879bb5);border-radius:18px;margin-bottom:-48px;background-size:cover;background-position:center;position:relative;z-index:1;overflow:hidden}
.profile-cover:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,transparent,rgba(0,0,0,.08));pointer-events:none}
.profile-head{display:flex;align-items:end;gap:14px;padding:0 12px;position:relative;z-index:3}
.profile-photo{width:88px;height:88px;flex:0 0 88px;border-radius:50%;object-fit:cover;background:var(--bg);border:5px solid var(--card);position:relative;z-index:4}
.profile-info{padding-top:12px;min-width:0;position:relative;z-index:4}
.profile-info h2{font-size:19px;overflow-wrap:anywhere}
.profile-page-head .profile-info{transform:translateY(9px)}
.profile-menu{display:flex;align-items:center;gap:13px;padding:16px 13px;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;color:var(--text);text-align:left}
.profile-menu:last-child{border-bottom:0}
.menu-icon{width:40px;height:40px;border-radius:14px;background:var(--glass-strong);display:grid;place-items:center;color:var(--accent)}
.profile-menu .grow{flex:1}
.profile-menu strong{font-size:12px}
.profile-menu small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.order{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--line);padding:17px;border-radius:19px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.status{font-size:10px;font-weight:800;border-radius:20px;padding:7px 11px;background:#f3e8ce;color:#94712e;white-space:nowrap}
.status.Selesai{background:#dff3e7;color:#328457}
.status.Ditolak{background:#f8e0e1;color:#bc535a}
.auth{max-width:440px;margin:20px auto}
.auth-logo{text-align:center;margin-bottom:22px}
.auth-logo h1{font-size:36px;letter-spacing:4px}
.remember{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-top:15px}
.admin-tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 17px}
.admin-tab{white-space:nowrap;background:var(--glass);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font-size:11px;font-weight:700;transition:.2s}
.admin-tab.active{background:#344b65;color:white}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:19px;padding:17px}
.stat strong{display:block;font-size:25px;margin-top:10px}
.stat span{font-size:10px;color:var(--muted)}
.admin-item{display:flex;align-items:center;gap:11px;padding:12px;background:var(--glass);border:1px solid var(--line);border-radius:16px;margin-top:10px}
.admin-item img{width:50px;height:50px;object-fit:cover;border-radius:12px}
.grow{flex:1;min-width:0}
.grow strong{font-size:12px;overflow-wrap:anywhere}
.grow small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:13px}
.hidden{display:none!important}
#view{transform-origin:center;will-change:opacity,transform}
.page-enter{animation:pageEnter .46s cubic-bezier(.22,.8,.25,1) both}
.page-exit{animation:pageExit .14s ease both;pointer-events:none}
@keyframes pageEnter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes pageExit{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-5px)}}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.skeleton{background:linear-gradient(100deg,var(--line) 25%,rgba(140,155,175,.22) 38%,var(--line) 55%);background-size:200% 100%;animation:shimmer 1.1s linear infinite;border-radius:12px}
@keyframes shimmer{to{background-position:-200% 0}}
.sk-line{height:13px;margin:12px 0;width:70%}
.sk-title{height:30px;width:55%;margin:12px 0}
.sk-banner{height:175px;border-radius:22px;margin:20px 0}
.sk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sk-card{height:220px;border-radius:18px}
.sk-panel{height:115px;margin-top:15px;border-radius:18px}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,17,28,.42);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;touch-action:pan-y;padding:15px;animation:fade .2s}
.modal{width:min(460px,100%);max-height:calc(100dvh - 30px);min-height:0;flex:0 0 auto;margin:auto 0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--glass-strong);backdrop-filter:blur(35px);color:var(--text);border:1px solid var(--line);border-radius:26px;padding:21px;box-shadow:0 25px 80px rgba(0,0,0,.2);animation:modalIn .28s}
@keyframes modalIn{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}
.modal-close{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:var(--glass);color:var(--text)}
.modal-image{width:100%;height:165px;object-fit:cover;border-radius:17px;margin:14px 0}
.modal-description{font-size:12px;line-height:1.8;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
/* Detail pemesanan: kunci semua scroll latar, sisakan backdrop sebagai satu-satunya scroller. */
html.order-modal-open,body.order-modal-open{overflow:hidden!important;height:100%!important;overscroll-behavior:none!important}
body.order-modal-open{position:fixed!important;width:100%!important}
.app.order-modal-locked{overflow:hidden!important;overscroll-behavior:none!important}
#modalRoot:empty{display:none}
#modalRoot:not(:empty){position:fixed;inset:0;z-index:101;overflow:hidden;overscroll-behavior:none}
.order-modal-backdrop{
 position:absolute!important;
 inset:0!important;
 z-index:1!important;
 display:block!important;
 width:100%!important;
 height:100%!important;
 overflow-x:hidden!important;
 overflow-y:auto!important;
 overscroll-behavior-y:contain!important;
 padding:15px 15px calc(15px + env(safe-area-inset-bottom))!important;
 touch-action:pan-y!important;
 -webkit-overflow-scrolling:touch;
}
.order-modal{
 max-height:none!important;
 height:auto!important;
 overflow:visible!important;
 margin:0 auto!important;
 touch-action:pan-y!important;
}
.quantity{display:flex;align-items:center;gap:10px}
.quantity button{width:42px;height:42px;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:12px;font-size:21px}
.quantity input{flex:1;min-width:0;text-align:center;padding:12px;background:var(--glass);color:var(--text);border:1px solid var(--line);border-radius:12px;font-size:16px;font-weight:800}
.toast{position:fixed;z-index:110;bottom:95px;left:50%;transform:translateX(-50%);background:#26394f;color:white;padding:13px 20px;border-radius:15px;font-size:12px;animation:fade .2s;max-width:90%;text-align:center}
.modal-actions{display:flex;gap:9px;margin-top:20px}
.modal-actions>*{flex:1}
.category-option{display:flex;align-items:center;justify-content:space-between;padding:15px;background:var(--glass);border:1px solid var(--line);border-radius:14px;margin-top:9px;width:100%;color:var(--text);text-align:left;font-size:13px;font-weight:700}
.category-option:active{transform:scale(.98)}
.admin-hero{padding:22px;border-radius:22px;background:linear-gradient(130deg,#253a54,#758ba6);color:white;margin-bottom:17px}
.admin-hero .muted{color:#e0e9f3}
.order-detail{padding:12px;background:var(--glass);border-radius:13px;margin-top:12px}
.order-detail p{font-size:11px;margin-top:7px;overflow-wrap:anywhere}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap input{padding-left:43px}
.search-result-info{font-size:11px;color:var(--muted);margin:12px 2px}
.upload-preview{width:100%;height:130px;border-radius:17px;object-fit:cover;background:var(--glass);border:1px solid var(--line);margin-top:12px}
.upload-note{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.7}
.file-label{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;background:var(--glass);border:1px dashed var(--accent);border-radius:14px;font-size:12px;font-weight:700;cursor:pointer}
@media(max-width:650px){
.app{padding:10px 12px 105px}.topbar-backplate{height:58px;top:6px}.topbar{height:58px;top:6px}.banner,.banner-content{height:155px}
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.product-image{height:125px}.product-info{padding:11px}.product-info h3{font-size:12px}
.price{font-size:14px}.category-grid{gap:7px}.category{padding:12px 3px}
.cat-icon{width:36px;height:36px}.category span{font-size:9px}
.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:20px}
.admin-item{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* LIQUID GLASS SYSTEM — konsisten di seluruh halaman */
:root{
 --glass:rgba(255,255,255,.43);
 --glass-strong:rgba(255,255,255,.64);
 --card:rgba(255,255,255,.52);
 --line:rgba(255,255,255,.66);
 --blur:30px;
 --shadow:0 16px 44px rgba(45,65,90,.11),inset 0 1px 1px rgba(255,255,255,.62);
}
body.dark{
 --glass:rgba(30,43,60,.48);
 --glass-strong:rgba(35,49,68,.66);
 --card:rgba(32,46,64,.58);
 --line:rgba(255,255,255,.15);
 --shadow:0 18px 48px rgba(0,0,0,.28),inset 0 1px 1px rgba(255,255,255,.09);
}
.glass,.topbar,.panel,.product,.category,.order,.stat,.admin-item,.banner-wrap,.modal,.toast,.iconbtn,.btn,.admin-tab,.category-option,.upload-preview,.file-label{
 -webkit-backdrop-filter:blur(30px) saturate(190%);
 backdrop-filter:blur(30px) saturate(190%);
 border-color:var(--line);
 box-shadow:var(--shadow);
}

function productToRow(p){return {id:Number(p.id),name:p.name,category:p.category||'',price:Number(p.price)||0,min_qty:Number(p.minQty)||1,max_qty:Number(p.maxQty)||99,rating:Number(p.rating)||0,sold:Number(p.sold)||0,image:p.image||'',description:p.description||'',updated_at:new Date().toISOString()}}
function rowToProduct(p){return {id:Number(p.id),name:p.name,category:p.category||'',price:Number(p.price)||0,minQty:Number(p.min_qty)||1,maxQty:Number(p.max_qty)||99,rating:Number(p.rating)||0,sold:Number(p.sold)||0,image:p.image||'',description:p.description||''}}
async function loadSharedData(){
 try{
  const [pr,ca,ba,se,sc]=await Promise.all([
   supabaseClient.from('products').select('*').order('id'),
   supabaseClient.from('categories').select('name').order('id'),
   supabaseClient.from('banners').select('*').order('position').order('id'),
   supabaseClient.from('store_settings').select('*').eq('id',1).maybeSingle(),
   supabaseClient.from('site_control').select('*').eq('id',1).maybeSingle()
  ]);
  for(const x of [pr,ca,ba,se,sc])if(x.error)throw x.error;
  if(sc.data)siteControl=sc.data;
  const admin=(await supabaseClient.auth.getSession()).data.session?.user?.id===ADMIN_UID;
  if(!pr.data.length&&admin){
   const seed=[];
   for(const p of products){
    if(!p.image&&p.imageKey){
     const blob=await readMedia(p.imageKey);
     if(blob)p.image=await uploadSharedMedia(blob,'products');
    }
    seed.push(productToRow(p));
   }
   if(seed.length){const w=await supabaseClient.from('products').upsert(seed);if(w.error)throw w.error;}
  }else if(pr.data.length)products=pr.data.map(rowToProduct);
  if(!ca.data.length&&admin){
   if(categories.length){const w=await supabaseClient.from('categories').insert(categories.map(name=>({name})));if(w.error)throw w.error;}
  }else if(ca.data.length)categories=ca.data.map(x=>x.name);
  if(!ba.data.length&&admin&&banners.length){
   const seed=[];
   for(let i=0;i<banners.length;i++){
    const b=banners[i];
    let image=typeof b==='string'?b:(b?.image||'');
    if(!image&&b?.key){
     const blob=await readMedia(b.key);
     if(blob){image=await uploadSharedMedia(blob,'banners');b.image=image;}
    }
    if(image)seed.push({image,link:typeof b==='string'?'':(b.link||''),position:i});
   }
   if(seed.length){const w=await supabaseClient.from('banners').insert(seed);if(w.error)throw w.error;}
  }else if(ba.data.length)banners=ba.data.map(b=>({id:b.id,image:b.image,link:b.link}));
  if(se.data)settings={store:se.data.store,phone:se.data.phone};

  persist();
  if($('#view'))render();
 }catch(e){console.error('Supabase shared data:',e);toast('Data online belum termuat: '+(e.message||'periksa koneksi'))}
}
async function uploadSharedMedia(file,folder){
 if(!file)throw new Error('File gambar tidak ditemukan.');
 const ext=(String(file.name||'').split('.').pop()||({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/avif':'avif' }[file.type]||'img')).toLowerCase().replace(/[^a-z0-9]/g,'')||'img';
 const path=folder+'/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;
 const {error}=await supabaseClient.storage.from('bliyo-media').upload(path,file,{contentType:file.type||undefined,upsert:false,cacheControl:'3600'});
 if(error)throw error;
 const {data}=supabaseClient.storage.from('bliyo-media').getPublicUrl(path);
 if(!data?.publicUrl)throw new Error('URL gambar online gagal dibuat.');
 return data.publicUrl;
}

 if(error)throw error;
 const ids=new Set(rows.map(p=>p.id));

 if(removed.length){const d=await supabaseClient.from('products').delete().in('id',removed);if(d.error)throw d.error;}
 if(rows.length){const u=await supabaseClient.from('products').upsert(rows);if(u.error)throw u.error;}
}

async function adminApi(action,payload={}){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session?.access_token)throw new Error('Sesi login tidak ditemukan.');
 const response=await fetch('/api/admin-manage'+(action==='status'||action==='list'?'?action='+encodeURIComponent(action):''),{
  method:action==='status'||action==='list'?'GET':'POST',
  headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},
  ...(action==='status'||action==='list'?{ }:{body:JSON.stringify({action,...payload})}),
  ...(action==='status'||action==='list'?{ }:{})
 });
 let result={};try{result=await response.json()}catch{}
 if(!response.ok)throw new Error(result.error||'Permintaan admin gagal.');
 return result;
}
async function checkAdminRole(token){

 try{
  const response=await fetch('/api/admin-manage?action=status',{headers:{authorization:'Bearer '+token},cache:'no-store'});
  const result=await response.json();
  return !!(response.ok&&result.isAdmin);
 }catch(e){console.warn('Verifikasi role admin:',e);return false}
}

function startSharedRealtime(){
 supabaseClient.channel('bliyo-shared-store')
 .on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>loadSharedData())
 .on('postgres_changes',{event:'*',schema:'public',table:'categories'},()=>loadSharedData())
 .on('postgres_changes',{event:'*',schema:'public',table:'banners'},()=>loadSharedData())
 .on('postgres_changes',{event:'*',schema:'public',table:'store_settings'},()=>loadSharedData())
 .on('postgres_changes',{event:'*',schema:'public',table:'site_control'},()=>refreshSiteControl())
 .on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrdersRemote().catch(e=>console.error('Pesanan:',e)))
 .on('postgres_changes',{event:'*',schema:'public',table:'user_profiles'},()=>loadAdminUsers().catch(e=>console.error('Pengguna:',e)))
 .subscribe((status,error)=>{
  console.info('BLIYO Realtime:',status,error||'');
  if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.error('BLIYO Realtime gagal tersambung:',error);
 });
 clearInterval(maintenancePollTimer);
 maintenancePollTimer=setInterval(()=>{refreshSiteControl();refreshAdminRole()},15000);
}
async function refreshSiteControl(){
 try{
  const {data,error}=await supabaseClient.from('site_control').select('*').eq('id',1).maybeSingle();
  if(error)throw error;
  if(data){
   const changed=!!siteControl.maintenance_enabled!==!!data.maintenance_enabled||siteControl.maintenance_message!==data.maintenance_message;
   siteControl=data;
   if(changed&&$('#view'))render();
  }
 }catch(e){console.error('Status maintenance:',e)}
}
async function saveMaintenanceSettings(enabled){
 if(user?.role!=='admin')return toast('Akses admin diperlukan.');
 const message=$('#maintenanceMessage')?.value.trim()||'BLIYO MARKET sedang dalam pemeliharaan. Silakan kembali beberapa saat lagi.';
 const btn=$('#maintenanceToggleBtn');
 if(btn){btn.disabled=true;btn.textContent='Menyimpan...'}
 try{
  const {data,error}=await supabaseClient.from('site_control').update({maintenance_enabled:!!enabled,maintenance_message:message,updated_at:new Date().toISOString()}).eq('id',1).select('*').single();
  if(error)throw error;
  siteControl=data;
  render();
  toast(enabled?'Maintenance berhasil diaktifkan.':'Maintenance berhasil dinonaktifkan.');
 }catch(e){toast('Gagal menyimpan maintenance: '+(e.message||'Periksa koneksi.'));if(btn){btn.disabled=false;btn.textContent=enabled?'Aktifkan maintenance':'Nonaktifkan maintenance'}}
}

/* DATABASE MEDIA - INDEXEDDB */
function openMediaDB(){
return new Promise((resolve,reject)=>{
let request=indexedDB.open('BLIYO_MARKET_MEDIA',1);
request.onupgradeneeded=()=>{let db=request.result;if(!db.objectStoreNames.contains('media'))db.createObjectStore('media')};
request.onsuccess=()=>{mediaDB=request.result;resolve(mediaDB)};
request.onerror=()=>reject(request.error);
});
}
function saveMedia(key,file){
return new Promise((resolve,reject)=>{
if(!mediaDB)return reject('Database belum siap.');
let tx=mediaDB.transaction('media','readwrite');tx.objectStore('media').put(file,key);
tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);
});
}
function readMedia(key){
return new Promise((resolve,reject)=>{
if(!mediaDB)return resolve(null);
let tx=mediaDB.transaction('media','readonly'),req=tx.objectStore('media').get(key);
req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
});
}
function deleteMedia(key){
return new Promise((resolve,reject)=>{
if(!mediaDB)return resolve();
let tx=mediaDB.transaction('media','readwrite');tx.objectStore('media').delete(key);
tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
});
}
function mediaURL(key){return key&&mediaCache[key]?mediaCache[key]:''}
async function loadMedia(key){
if(!key)return '';
if(mediaCache[key])return mediaCache[key];
try{
let blob=await readMedia(key);
if(!blob)return '';
let url=URL.createObjectURL(blob);
mediaCache[key]=url;
return url;
}catch{return ''}
}
function newMediaKey(){return 'blmedia_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function isImageFile(file){
return !!file&&(file.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(file.name||''));
}
async function uploadMedia(file){
if(!file)return null;
if(file.size>MAX_MEDIA){toast('Ukuran file maksimal 25 MB.');return null}
if(!isImageFile(file)){toast('File harus berupa gambar atau GIF.');return null}
let key=newMediaKey();
try{await saveMedia(key,file);return key}catch(e){toast('Gagal menyimpan file. Periksa kapasitas penyimpanan browser.');return null}
}
function safeLink(value){
let v=String(value||'').trim();
if(!v)return '';
if(/^https?:\/\//i.test(v)||v.startsWith('/')||v.startsWith('#'))return v;
return '';
}
function productImage(p){return (p?.imageKey&&mediaURL(p.imageKey))||p?.image||'https://placehold.co/700x450/e9edf3/66768b?text=BLIYO+MARKET'}
function bannerSource(b){return typeof b==='string'?b:(b?.image|| (b?.key?mediaURL(b.key):''))}
function bannerLink(b){return typeof b==='object'?safeLink(b.link):''}

};

/* ROUTING */
const routeNames={home:'home',categories:'categories',products:'products',history:'history',profile:'profile',login:'login',register:'register',verify:'verify',editprofile:'editprofile',password:'password',admin:'admin',search:'search'};
function pageFromURL(){
let path=location.pathname.split('/').filter(Boolean).pop();
if(routeNames[path])return path;
let hash=location.hash.replace('#','').split('?')[0];
if(routeNames[hash])return hash;
return 'home';
}
function updateNavIndicator(animate=false){
 const nav=$('#bottomNav'),indicator=$('#navIndicator'),active=nav?.querySelector('.navitem.active');
 if(!nav||!indicator||!active)return;
 const x=active.offsetLeft+4;
 indicator.style.width=Math.max(0,active.offsetWidth-8)+'px';
 indicator.style.setProperty('--indicator-x',x+'px');
 if(animate){
  indicator.classList.remove('bubble-bounce');
  void indicator.offsetWidth;
  indicator.classList.add('bubble-bounce');
 }
}
window.addEventListener('resize',updateNavIndicator);
let pageTransitionToken=0;
function transitionToPage(page){
 if(!routeNames[page])page='home';
 if(page===current)return;
 const view=$('#view'),token=++pageTransitionToken;
 view?.classList.remove('page-enter');
 view?.classList.add('page-exit');
 current=page;
 document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active',el.dataset.page===current));
 updateNavIndicator(true);
 window.setTimeout(()=>{
  if(token!==pageTransitionToken)return;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
 },140);
}
function navigate(page){
 if(!routeNames[page])page='home';
 // Halaman yang sama: jangan render ulang, jangan scroll, dan jangan tambah history.
 if(page===current)return;
 try{history.pushState({page},'','/'+page)}catch{history.pushState({page},'','#'+page)}
 transitionToPage(page);
}
window.addEventListener('popstate',e=>{
const page=e.state?.page||pageFromURL();adminTab=e.state?.adminTab||adminTab;
if(page===current)return;
transitionToPage(page);
});
function greeting(){
let h=Number(new Intl.DateTimeFormat('id-ID',{hour:'numeric',hour12:false,timeZone:'Asia/Jakarta'}).format(new Date()));
let g=h>=4&&h<11?'Selamat pagi':h>=11&&h<15?'Selamat siang':h>=15&&h<18?'Selamat sore':'Selamat malam';
let t=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}).format(new Date());
return g+' · '+t+' WIB · Asia/Jakarta';
}

let p=selectedProduct,min=Math.max(1,Number(p.minQty)||1),max=Math.max(min,Number(p.maxQty)||99),rawOrderImage=(p?.imageKey&&mediaURL(p.imageKey))||p?.image||'',orderImage=/placehold\.co|placehold\.it|BLIYO(?:\+|%20|\s)MARKET/i.test(rawOrderImage)?'':rawOrderImage;

<div class="row" style="margin-top:16px;padding:14px;background:var(--glass);border-radius:13px"><strong>Total pembayaran</strong><strong id="buyTotal">${money(p.price*min)}</strong></div>

function getQty(){let val=$('#buyerQty')?.value;if(val===''||val===undefined)return null;let n=Number(val);return Number.isInteger(n)?n:null}
function changeQty(step){
let input=$('#buyerQty');if(!input)return;
let min=Math.max(1,Number(selectedProduct.minQty)||1),max=Math.max(min,Number(selectedProduct.maxQty)||99),n=getQty();
input.value=Math.min(max,Math.max(min,(n===null?min:n)+step));updateTotal();
}
function normalizeQty(){
let input=$('#buyerQty');if(!input)return;
let min=Math.max(1,Number(selectedProduct.minQty)||1),max=Math.max(min,Number(selectedProduct.maxQty)||99),n=getQty();
input.value=Math.max(min,Math.min(max,n===null?min:n));updateTotal();
}
function updateTotal(){
let qty=getQty(),total=$('#buyTotal');if(!total||!selectedProduct)return;
total.textContent=qty===null?'Masukkan jumlah':money(selectedProduct.price*qty);
}
async function sendWhatsApp(){
let p=selectedProduct;if(!p)return;
let qty=getQty(),min=Math.max(1,Number(p.minQty)||1),max=Math.max(min,Number(p.maxQty)||99);
if(qty===null||qty<min||qty>max)return toast(`Jumlah harus ${min} sampai ${max}.`);
if(!settings.phone)return toast('Nomor WhatsApp admin belum diatur.');
if(!user?.id)return toast('Login ulang dengan akun online sebelum memesan.');
let orderId=makeOrderId(),total=p.price*qty,additional=$('#extraMessage')?.value.trim()||'',date=new Date().toLocaleString('id-ID');
const row={id:orderId,user_id:user.id,name:user.name,email:user.email,product:p.name,price:p.price,qty,total,status:'Menunggu',date_label:date,message:additional};

/* CAPTCHA */
let captchaTimer;
function newCaptcha(){
clearInterval(captchaTimer);captcha.code=String(Math.floor(100000+Math.random()*900000));captcha.expires=Date.now()+60000;updateCaptcha();
captchaTimer=setInterval(()=>{if(Date.now()>=captcha.expires){clearInterval(captchaTimer);captcha.code='';updateCaptcha()}else updateCaptcha()},1000);
}
function updateCaptcha(){
let code=$('#captchaCode'),time=$('#captchaTimer');if(code)code.textContent=captcha.code||'------';
if(time){let sec=Math.max(0,Math.ceil((captcha.expires-Date.now())/1000));time.textContent=captcha.code?`Berlaku ${sec} detik`:'Kode kedaluwarsa'}
}
function checkCaptcha(){
let entered=$('#captchaInput')?.value.trim();
if(!captcha.code||Date.now()>=captcha.expires){toast('Captcha kedaluwarsa.');newCaptcha();return false}
if(entered!==captcha.code){toast('Captcha tidak sesuai.');return false}return true;
}

/* MIGRASI AKUN LAMA: ANTREAN AMAN TANPA MENYIMPAN PASSWORD */
function migrationQueue(){return get('bl_auth_migration_queue',{});}
function setMigrationState(email,state,nextRetryAt=0){
const queue=migrationQueue();queue[email]={state,nextRetryAt,updatedAt:Date.now()};
put('bl_auth_migration_queue',queue);
}
function clearMigrationState(email){
const queue=migrationQueue();delete queue[email];put('bl_auth_migration_queue',queue);
}

/* LOGIN - RESTORE AVATAR DAN BANNER + FALLBACK RATE LIMIT */
async function login(){
if(!checkCaptcha())return;
let email=$('#loginEmail').value.trim().toLowerCase(),pass=$('#loginPassword').value;
if(!email||!pass)return toast('Masukkan email dan password.');
let {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
let migratedLegacy=null;
if(!error){clearMigrationState(email);pendingVerificationEmail='';localStorage.removeItem('bl_pending_verification_email');}
if(error){
const authMessage=String(error.message||'').toLowerCase();
if(error.code==='email_not_confirmed'||authMessage.includes('email not confirmed')||authMessage.includes('email_not_confirmed')){
 pendingVerificationEmail=email;put('bl_pending_verification_email',email);navigate('verify');
 return toast('Email belum dikonfirmasi. Periksa Inbox atau Spam terlebih dahulu.');
}
if(/rate.?limit|too many requests|over_email_send_rate_limit/i.test(authMessage))return toast('Terlalu banyak percobaan. Tunggu beberapa saat sebelum mencoba lagi.');
migratedLegacy=get('bl_users',[]).find(u=>u.email===email&&u.password===pass);
if(!migratedLegacy){
 if(/invalid login credentials|invalid_credentials|email or password/i.test(authMessage))return toast('Email atau password salah.');
 return toast('Login gagal: '+(error.message||'Periksa koneksi lalu coba lagi.'));
}
const queued=migrationQueue()[email];
if(queued?.state==='waiting_rate_limit'&&queued.nextRetryAt>Date.now()){
const mins=Math.ceil((queued.nextRetryAt-Date.now())/60000);
return toast('Migrasi sedang dalam antrean. Coba lagi sekitar '+mins+' menit.');
}
if(queued?.state==='waiting_confirmation'){
 pendingVerificationEmail=email;put('bl_pending_verification_email',email);navigate('verify');
 return toast('Akun menunggu konfirmasi email. Periksa Inbox atau Spam.');
}
const migrated=await supabaseClient.auth.signUp({email,password:pass,options:{data:{name:migratedLegacy.name||'Pengguna'},emailRedirectTo:'https://bliyomarket.vercel.app/'}});
if(migrated.error){
const message=String(migrated.error.message||'');
if(/rate.?limit|too many requests|email rate/i.test(message)){
setMigrationState(email,'waiting_rate_limit',Date.now()+60*60*1000);
return toast('Batas email Supabase tercapai. Akun aman dalam antrean; coba lagi sekitar 1 jam.');
}
return toast('Akun lama belum bisa dipindahkan: '+message);
}
if(!migrated.data.session){
setMigrationState(email,'waiting_confirmation');pendingVerificationEmail=email;put('bl_pending_verification_email',email);navigate('verify');
return toast('Akun sudah didaftarkan. Konfirmasi email sebelum login.');
}
clearMigrationState(email);
data=migrated.data;
put('bl_users',get('bl_users',[]).filter(u=>u.email!==email));
}
if(!data?.user)return toast('Login belum berhasil. Coba lagi.');
if(email===ADMIN_EMAIL&&data.user.id!==ADMIN_UID){await supabaseClient.auth.signOut();return toast('Akun ini tidak memiliki izin admin BLIYO.');}
const isAdmin=data.user.id===ADMIN_UID||await checkAdminRole(data.session?.access_token);
const {data:profile,error:profileError}=await supabaseClient.from('user_profiles').select('name').eq('id',data.user.id).maybeSingle();
if(profileError)console.warn('Gagal memuat nama profil:',profileError);
let savedProfile=get('bl_last_profile',null);
let legacyProfile=migratedLegacy||get('bl_users',[]).find(u=>String(u.email||'').trim().toLowerCase()===email.toLowerCase());
if(!legacyProfile&&savedProfile&&String(savedProfile.email||'').trim().toLowerCase()===email.toLowerCase())legacyProfile=savedProfile;
user={id:data.user.id,name:profile?.name||data.user.user_metadata?.name||legacyProfile?.name||(data.user.id===ADMIN_UID?'Administrator':'Pengguna'),email,role:isAdmin?'admin':'user',photoKey:legacyProfile?.photoKey||'',coverKey:legacyProfile?.coverKey||''};
put('bl_user',user);setSession();
await restoreProfileMedia();
if(isAdmin){await loadAdminUsers().catch(e=>console.error(e));if(user.id===ADMIN_UID)await loadAdminManagement().catch(e=>console.error(e));}
await loadOrdersRemote().catch(e=>console.error('Pesanan:',e));
clearInterval(captchaTimer);navigate('home');toast(isAdmin?'Login admin berhasil.':'Login berhasil.');
}

<div class="field"><label>Password lama</label><input id="oldPass" type="password" placeholder="Password saat ini"></div>
<div class="field"><label>Password baru</label><input id="newPass" type="password" placeholder="Minimal 6 karakter"></div>
<div class="field"><label>Konfirmasi password baru</label><input id="confirmPass" type="password" placeholder="Ulangi password baru"></div>
<button class="primary" style="width:100%;margin-top:20px" onclick="changePassword()">Simpan password baru</button></div></section>`;

async function changePassword(){
let old=$('#oldPass').value,next=$('#newPass').value,confirm=$('#confirmPass').value;
if(next.length<6)return toast('Password baru minimal 6 karakter.');
if(next!==confirm)return toast('Konfirmasi password tidak cocok.');
const {error:verifyError}=await supabaseClient.auth.signInWithPassword({email:user.email,password:old});
if(verifyError)return toast('Password lama salah.');
const {error}=await supabaseClient.auth.updateUser({password:next});
if(error)return toast('Gagal memperbarui password: '+error.message);
toast('Password berhasil diperbarui.');navigate('profile');
}

/* LOGOUT - TIDAK MENGHAPUS FOTO ATAU BANNER */
async function logout(){
if(user){saveAccountProfile();saveLastProfile();}
const {error}=await supabaseClient.auth.signOut();
if(error){toast('Gagal logout: '+error.message);return;}
/* Akhiri sesi dan arahkan langsung ke halaman login. Data profil dan media tetap disimpan. */
user=null;
localStorage.removeItem('bl_user');
localStorage.removeItem('bl_exp');
sessionStorage.removeItem('bl_user');
current='login';
try{history.pushState({page:'login'},'','/login')}catch{history.pushState({page:'login'},'','#login')}
render();
window.scrollTo({top:0,behavior:'instant'});
toast('Kamu sudah logout. Silakan login kembali.');
}

async function runBackup(){
if(user?.role!=='admin')return toast('Akses admin diperlukan.');
const btn=$('#backupBtn');
if(btn){btn.disabled=true;btn.textContent='Menyiapkan cadangan...';}
try{
const {data:{session}}=await supabaseClient.auth.getSession();
if(!session?.access_token)throw new Error('Sesi admin tidak ditemukan. Login ulang.');
const response=await fetch('/api/backup-sync',{
method:'POST',
headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},
body:JSON.stringify({scope:'all'})
});
const result=await response.json();
if(!response.ok||!result.ok)throw new Error(result.detail||result.error||'Sinkronisasi gagal.');
const summary=Object.entries(result.summary||{}).map(([name,count])=>name+': '+count).join(' · ');
toast('Cadangan Cloudflare selesai. '+summary);
}catch(error){toast('Cadangan gagal: '+error.message);}
finally{if(btn){btn.disabled=false;btn.textContent='Cadangkan ke Cloudflare';}}
}
let adminDrawerScrollY=0;
function toggleAdminMenu(force){
const next=typeof force==='boolean'?force:!adminMenuOpen;
if(next===adminMenuOpen)return;
const app=document.querySelector('.app');
adminMenuOpen=next;
if(adminMenuOpen){
 adminDrawerScrollY=app?.scrollTop||0;
 app?.classList.add('admin-drawer-locked');
 document.body.classList.add('admin-drawer-open');
}else{
 document.body.classList.remove('admin-drawer-open');
 app?.classList.remove('admin-drawer-locked');
 if(app)app.scrollTop=adminDrawerScrollY;
}
}

async function loadCloudflareSyncStatus(){
 const panel=$('#syncStatusPanel');
 if(!panel)return;
 panel.innerHTML='<div class="empty">Memuat status sinkronisasi...</div>';
 try{
  const {data,error}=await supabaseClient.rpc('admin_cloudflare_sync_status');
  if(error)throw error;
  const d=data||{},items=Array.isArray(d.recent)?d.recent:[];
  const fmt=v=>v?new Date(v).toLocaleString('id-ID'):'—';
  const rows=items.map(x=>{
   const status=esc(x.status||'Menunggu');
   const badge=x.sent_at?'<span class="status Selesai">Terkirim</span>':x.last_error?'<span class="status Ditolak">Retry</span>':'<span class="status">Proses</span>';
   return '<div class="admin-item"><div class="grow"><strong>'+esc(x.table||'—')+' · '+esc(x.event||'—')+'</strong><small>'+status+' · Percobaan: '+Number(x.attempts||0)+' · '+fmt(x.created_at)+'</small>'+(x.last_error?'<small class="danger">'+esc(x.last_error)+'</small>':'')+'</div>'+badge+'</div>';
  }).join('');
  panel.innerHTML='<div class="stats">'+
   '<div class="stat"><span>Menunggu</span><strong>'+Number(d.pending||0)+'</strong></div>'+
   '<div class="stat"><span>Terkirim</span><strong>'+Number(d.delivered||0)+'</strong></div>'+
   '<div class="stat"><span>Dalam retry</span><strong>'+Number(d.retrying||0)+'</strong></div></div>'+
   '<div class="row" style="margin:16px 0"><span class="muted">Perubahan terakhir</span><strong style="font-size:11px">'+fmt(d.last_event_at)+'</strong></div>'+
   '<div class="section-head"><h2>Aktivitas terbaru</h2><span class="muted">'+items.length+' catatan</span></div>'+
   (rows||'<div class="empty">Belum ada aktivitas sinkronisasi.</div>')+
   '<p class="upload-note">Pemeriksaan manual. Antrean diproses otomatis setiap 10 detik. Data yang tertahan akan dicoba ulang secara bertahap.</p>';
 }catch(e){
  panel.innerHTML='<div class="empty">Gagal memuat status: '+esc(e.message||'Kesalahan tidak diketahui')+'</div>';
 }
}

}

}

<div class="order-detail"><p><b>Nama:</b> ${esc(o.name||'Tidak tersedia')}</p><p><b>Email:</b> ${esc(o.email||'Tidak tersedia')}</p><p><b>Produk:</b> ${esc(o.product)}</p><p><b>Harga:</b> ${money(o.price)}</p><p><b>Jumlah:</b> ${o.qty}</p><p><b>Total:</b> <strong>${money(o.total)}</strong></p><p><b>Tanggal:</b> ${esc(o.date)}</p>${o.message?`<p><b>Pesan tambahan:</b> ${esc(o.message)}</p>`:''}</div>
<div class="field"><label>Ubah status pesanan</label><div class="btn" style="width:100%;text-align:left" onclick="openStatusPicker('${esc(o.id)}')">${esc(o.status)} ▾</div></div></div>`;
}
function openStatusPicker(id){openPicker('Status pesanan',['Menunggu','Selesai','Ditolak'].map(s=>({label:s,value:s})),s=>setStatus(id,s))}
async function saveProduct(){
let id=Number($('#pId').value),name=$('#pName').value.trim(),price=Number($('#pPrice').value);
let min=Number($('#pMin').value),max=Number($('#pMax').value);
if(!name||!$('#pPrice').value||price<0)return toast('Lengkapi nama dan harga produk.');
if(!Number.isInteger(min)||!Number.isInteger(max)||min<1||max<min)return toast('Batas jumlah produk tidak valid.');
if(!$('#pCategory').value)return toast('Pilih kategori produk.');
let old=id?products.find(p=>p.id===id):null;
let imageKey=old?.imageKey||'',image=$('#pImageUrl').value.trim()||old?.image||'';
let file=$('#pImageFile')?.files?.[0];
if(file){
 let newKey=await uploadMedia(file);if(!newKey)return;
 try{image=await uploadSharedMedia(file,'products')}
 catch(e){await deleteMedia(newKey);toast('Gagal mengunggah gambar produk online: '+e.message);return}
 if(imageKey)await deleteMedia(imageKey);
 imageKey=newKey;
}else if(!image&&imageKey){
 try{const localBlob=await readMedia(imageKey);if(localBlob)image=await uploadSharedMedia(localBlob,'products')}
 catch(e){toast('Gagal memindahkan gambar produk ke penyimpanan online: '+e.message);return}
}
let data={name,category:$('#pCategory').value,price,minQty:min,maxQty:max,rating:Math.max(0,Math.min(5,Number($('#pRating').value)||5)),description:$('#pDesc').value.trim(),image,imageKey};
if(old){Object.assign(old,data);toast('Produk berhasil diperbarui.')}
else{products.unshift({id:Date.now(),...data,sold:0});toast('Produk berhasil ditambahkan.')}
persist();
try{await saveProductsRemote()}catch(e){toast('Gagal menyimpan produk online: '+e.message);return}
render();
}
function editProduct(id){
let p=products.find(x=>x.id===id);if(!p)return;
$('#pId').value=p.id;$('#pName').value=p.name;$('#pCategory').value=p.category;$('#pCategoryLabel').textContent=p.category;
$('#pPrice').value=p.price;$('#pMin').value=p.minQty||1;$('#pMax').value=p.maxQty||99;
$('#pRating').value=p.rating;$('#pDesc').value=p.description;
$('#pImageUrl').value=p.image||'';
$('#pImagePreview').src=productImage(p);
$('#pImageFile').value='';
window.scrollTo({top:0,behavior:'smooth'});
}
function resetProductForm(){
['pId','pName','pPrice','pDesc','pImageUrl','pCategory'].forEach(id=>$('#'+id).value='');
$('#pCategoryLabel').textContent='Pilih kategori ▾';
$('#pRating').value=5;$('#pMin').value=1;$('#pMax').value=99;
$('#pImageFile').value='';$('#pImagePreview').src='https://placehold.co/700x350/e9edf3/66768b?text=Preview+Produk';
}
function deleteProduct(id){
confirmDialog('Hapus produk?','Produk ini akan dihapus dari daftar toko.',async()=>{
let p=products.find(x=>x.id===id);
products=products.filter(p=>p.id!==id);
if(p?.imageKey)await deleteMedia(p.imageKey);
persist();
try{await saveProductsRemote()}catch(e){toast('Gagal menghapus produk online: '+e.message);return}
render();toast('Produk berhasil dihapus.');
});
}
function addCategory(){
let c=$('#catName').value.trim();if(!c)return toast('Masukkan nama kategori.');
if(categories.includes(c))return toast('Kategori sudah ada.');
categories.push(c);persist();
saveCategoriesRemote().then(()=>{render();toast('Kategori ditambahkan.')}).catch(e=>toast('Gagal menyimpan kategori online: '+e.message));
}
function deleteCategory(c){
confirmDialog('Hapus kategori?','Kategori '+c+' akan dihapus.',()=>{
categories=categories.filter(x=>x!==c);persist();
saveCategoriesRemote().then(()=>{render();toast('Kategori dihapus.')}).catch(e=>toast('Gagal menghapus kategori online: '+e.message));
});
}
async function addBanner(){
let file=$('#bannerFile')?.files?.[0],url=$('#bannerImageUrl')?.value.trim()||'',link=safeLink($('#bannerLinkInput')?.value);
if(!file&&!url)return toast('Pilih gambar atau masukkan URL gambar.');
let item={key:'',image:url,link};
if(file){
 let key=await uploadMedia(file);if(!key)return;
 try{
  item.image=await uploadSharedMedia(file,'banners');
  item.key=key;await loadMedia(key);
 }catch(e){await deleteMedia(key);toast('Gagal mengunggah banner online: '+e.message);return}
}
banners.push(item);persist();
try{await saveBannersRemote();render();toast('Banner berhasil ditambahkan dan disinkronkan.')}
catch(e){toast('Gagal menyimpan banner online: '+e.message)}
}
function deleteBanner(i){
confirmDialog('Hapus banner?','Banner ini tidak akan ditampilkan lagi.',async()=>{
let b=banners[i];if(b&&typeof b==='object'&&b.key){
await deleteMedia(b.key);
if(mediaCache[b.key]){URL.revokeObjectURL(mediaCache[b.key]);delete mediaCache[b.key]}
}
banners.splice(i,1);bannerIndex=0;persist();
saveBannersRemote().then(()=>{render();toast('Banner dihapus.')}).catch(e=>toast('Gagal menghapus banner online: '+e.message));
});
}
async function setStatus(id,status){
const {error}=await supabaseClient.from('orders').update({status}).eq('id',id);
if(error)return toast('Gagal mengubah status: '+error.message);
let o=orders.find(x=>x.id===id);if(o)o.status=status;persist();render();toast('Status pesanan diperbarui.');
}
function saveSettings(){
let phone=$('#storePhone').value.trim().replace(/\D/g,'');
if(!phone)return toast('Nomor WhatsApp wajib diisi.');
settings.store=$('#storeName').value.trim()||'BLIYO MARKET';settings.phone=phone;
persist();
saveSettingsRemote().then(()=>toast('Pengaturan berhasil disimpan.')).catch(e=>toast('Gagal menyimpan pengaturan online: '+e.message));
}

/* RENDER */
function maintenancePage(){
 const message=siteControl.maintenance_message||'BLIYO MARKET sedang dalam pemeliharaan. Silakan kembali beberapa saat lagi.';
 return `<section class="fade" style="min-height:72vh;display:grid;place-items:center"><div class="panel" style="width:min(560px,100%);padding:30px 22px;text-align:center"><div style="width:76px;height:76px;border-radius:25px;background:var(--glass-strong);display:grid;place-items:center;margin:0 auto 20px;color:var(--accent)"><svg viewBox="0 0 24 24" style="width:38px;height:38px"><path d="M14.7 6.3a5 5 0 0 0-6.9 6.9L3 18l3 3 4.8-4.8a5 5 0 0 0 6.9-6.9l-3 3-3-3 3-3z"/><path d="m14 10 3 3"/></svg></div><div class="eyebrow">BLIYO MARKET</div><h1 style="font-size:27px;margin-top:10px">Sedang Dalam Maintenance</h1><p class="muted" style="font-size:13px;margin:12px auto 0;max-width:410px">${esc(message)}</p><div class="status" style="display:inline-block;margin-top:20px">Situs sementara tidak tersedia</div><p class="muted" style="margin-top:17px">Halaman akan diperbarui otomatis setelah maintenance selesai.</p><button class="primary" style="margin-top:20px" onclick="location.reload()">Coba Lagi</button></div></section>`;
}
function render(options={}){
clearInterval(bannerTimer);clearTimeout(bannerTransitionTimer);
/* Drawer lama sudah dipindah ke body, jadi wajib dibersihkan sebelum render ulang. */
document.querySelectorAll('body > .admin-drawer,body > .admin-drawer-backdrop').forEach(el=>el.remove());
const blocked=!!siteControl.maintenance_enabled&&user?.role!=='admin'&&current!=='login';
let isAdmin=current==='admin'||blocked;
$('#bottomNav').classList.toggle('hidden',isAdmin);
document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active',el.dataset.page===current));
 updateNavIndicator();
let pages={home:homePage,categories:categoriesPage,products:productsPage,history:historyPage,profile:profilePage,login:loginPage,register:registerPage,verify:verificationPage,editprofile:editProfilePage,password:passwordPage,admin:renderAdmin,search:searchPage};
$('#view').innerHTML=blocked?maintenancePage():(pages[current]||homePage)();
/* Portal drawer ke body agar tidak ikut area scroll .app di Android. */
if(current==='admin'&&!blocked){
 const backdrop=$('#view .admin-drawer-backdrop');
 const drawer=$('#view .admin-drawer');
 if(backdrop)document.body.appendChild(backdrop);
 if(drawer)document.body.appendChild(drawer);
}
$('#view').setAttribute('aria-busy','false');
$('#view').classList.remove('page-exit','page-enter');
if(options.instant){
 $('#view').style.animation='none';
}else{
 $('#view').style.animation='';
 $('#view').classList.add('page-enter');
}
if(current==='home')startBanners();
if(current==='admin'&&adminTab==='sync')loadCloudflareSyncStatus();
if(current==='login'||current==='register')newCaptcha();
}

/* SESSION */
async function init(){
current=pageFromURL();
if(current==='admin')$('#bottomNav').classList.add('hidden');
$('#view').innerHTML=skeletonHTML(current);
try{await openMediaDB()}catch(e){console.error('Media DB:',e)}
const {data:{session}}=await supabaseClient.auth.getSession();
user=null;
if(session?.user){
if(session.user.email_confirmed_at){pendingVerificationEmail='';localStorage.removeItem('bl_pending_verification_email');}
const authUser=session.user,isAdmin=authUser.id===ADMIN_UID||await checkAdminRole(session.access_token);
const {data:profile,error:profileError}=await supabaseClient.from('user_profiles').select('name').eq('id',authUser.id).maybeSingle();
if(profileError)console.warn('Gagal memuat nama profil:',profileError);
let email=String(authUser.email||'').trim().toLowerCase();
let local=get('bl_users',[]).find(x=>String(x.email||'').trim().toLowerCase()===email);
let saved=get('bl_last_profile',null);
if(!local&&saved&&String(saved.email||'').trim().toLowerCase()===email)local=saved;
user={id:authUser.id,name:profile?.name||authUser.user_metadata?.name||local?.name||(authUser.id===ADMIN_UID?'Administrator':'Pengguna'),email:authUser.email,role:isAdmin?'admin':'user',photoKey:local?.photoKey||'',coverKey:local?.coverKey||''};
put('bl_user',user);
}else{
localStorage.removeItem('bl_user');sessionStorage.removeItem('bl_user');localStorage.removeItem('bl_exp');
}
await loadSharedData();startSharedRealtime();
if(user){
await restoreProfileMedia();
await loadOrdersRemote().catch(e=>console.error('Pesanan online:',e));
if(user.role==='admin'){await loadAdminUsers().catch(e=>console.error('Pengguna online:',e));if(user.id===ADMIN_UID)await loadAdminManagement().catch(e=>console.error('Manajemen admin:',e));}
}else await restoreLastProfileMedia();
for(let p of products){if(p.imageKey)await loadMedia(p.imageKey)}
for(let b of banners){if(b&&typeof b==='object'&&b.key)await loadMedia(b.key)}
current=pageFromURL();if(!user&&current==='admin')current='home';
history.replaceState({page:current},'','/'+current);render();
}
init();
</script>
