<style>
:root{
--bg:#edf2f8;--card:rgba(255,255,255,.63);--glass:rgba(255,255,255,.48);
--glass-strong:rgba(255,255,255,.72);--text:#202b3a;--muted:#8190a2;
--line:rgba(255,255,255,.72);--accent:#526b88;
--shadow:0 12px 40px rgba(35,50,70,.10);--green:#269b70;--red:#d65e69;--blur:26px;
}
body.dark{
--bg:#101722;--card:rgba(34,45,61,.72);--glass:rgba(35,47,64,.58);
--glass-strong:rgba(35,47,64,.82);--text:#f0f3f8;--muted:#a2afbf;
--line:rgba(255,255,255,.12);--accent:#b1c6df;--shadow:0 12px 40px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:Inter,sans-serif;
background:radial-gradient(ellipse at 5% 0%,rgba(126,190,224,.27),transparent 45%),
radial-gradient(ellipse at 100% 80%,rgba(139,171,207,.23),transparent 45%),var(--bg);
color:var(--text);min-height:100vh;transition:background .3s,color .3s;
}
body,button,input,textarea{font-family:Inter,sans-serif}
button{cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%}
.app{max-width:1150px;margin:auto;padding:12px 17px 110px;min-height:100vh}
.glass{
background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(180%);

.topbar{height:63px;padding:0 17px;border-radius:22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:8px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2px;font-size:15px}
.brand img{width:37px;height:37px;object-fit:contain;border-radius:10px}
.actions{display:flex;gap:9px}
.iconbtn{width:41px;height:41px;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:15px;display:grid;place-items:center;transition:.25s}

main{padding-top:25px;min-height:70vh}
h1,h2,h3{letter-spacing:-.7px}
.muted{color:var(--muted);font-size:12px;line-height:1.7}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}
.section-head h2{font-size:19px}
.link{border:0;background:none;color:var(--accent);font-size:12px;font-weight:700}
.banner-wrap{margin-top:23px;border-radius:24px;overflow:hidden;position:relative}
.banner-link{display:block;width:100%;height:100%;text-decoration:none;color:inherit}
.banner{height:200px;width:100%;object-fit:cover;display:block;background:var(--card)}
.banner-content{width:100%;height:200px;display:grid;place-items:center;color:var(--muted)}
.banner-transition{animation:bannerIn .65s cubic-bezier(.2,.7,.2,1) both}
.banner-out{animation:bannerOut .22s ease both}
@keyframes bannerIn{from{opacity:0;transform:scale(1.035);filter:blur(5px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes bannerOut{to{opacity:0;transform:scale(.985);filter:blur(4px)}}

.dot{width:7px;height:7px;border-radius:10px;background:var(--muted);border:0;padding:0}
.dot.active{width:20px;background:var(--accent)}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.category{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:16px 5px;text-align:center;transition:.25s}
.category:active,.product:active{transform:scale(.97)}
.cat-icon{width:43px;height:43px;border-radius:15px;background:var(--glass-strong);display:grid;place-items:center;margin:0 auto 10px;color:var(--accent)}
.category span{font-size:10px;font-weight:700}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.product{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:21px;overflow:hidden;transition:transform .25s,box-shadow .25s;box-shadow:0 7px 25px rgba(35,50,70,.05)}

.product-image img{width:100%;height:100%;object-fit:cover;display:block}
.product-info{padding:14px}

.product-description{color:var(--muted);font-size:11px;line-height:1.65;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
.product-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;gap:5px}
.price{font-size:17px;font-weight:800;margin-top:10px}

.danger{color:var(--red)}
.field{margin-top:15px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}
.field input,.field textarea,.search{width:100%;padding:13px;background:var(--glass-strong);color:var(--text);border:1px solid var(--line);border-radius:14px;outline:none;font-size:13px}

.field input:focus,.field textarea:focus,.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(100,130,160,.12)}

.navitem{position:relative;background:none;border:0;color:var(--muted);display:flex;align-items:center;flex-direction:column;gap:4px;font-size:10px;padding:8px 0;font-weight:700;transition:color .25s,transform .25s}

.modal-actions{display:flex;gap:9px;margin-top:20px}
.modal-actions>*{flex:1}
.category-option{display:flex;align-items:center;justify-content:space-between;padding:15px;background:var(--glass);border:1px solid var(--line);border-radius:14px;margin-top:9px;width:100%;color:var(--text);text-align:left;font-size:13px;font-weight:700}

.admin-hero{padding:22px;border-radius:22px;background:linear-gradient(130deg,#253a54,#758ba6);color:white;margin-bottom:17px}

.search-wrap{position:relative}

.search-wrap input{padding-left:43px}

.upload-preview{width:100%;height:130px;border-radius:17px;object-fit:cover;background:var(--glass);border:1px solid var(--line);margin-top:12px}
.upload-note{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.7}

@media(max-width:650px){

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

let user=get('bl_user',null);
let lastProfile=get('bl_last_profile',null);

{id:1,name:'Spotify Premium',category:'Aplikasi Premium',price:15000,minQty:1,maxQty:99,rating:4.9,sold:120,image:'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=700',description:'Akses musik premium dengan pengalaman mendengarkan yang nyaman.'},
{id:2,name:'Canva Pro',category:'Aplikasi Premium',price:12000,minQty:1,maxQty:50,rating:4.8,sold:95,image:'https://images.unsplash.com/photo-1545235617-9465d2a55698?w=700',description:'Buat desain dengan fitur premium.'},
{id:3,name:'Jasa Edit Video',category:'Jasa Edit',price:25000,minQty:1,maxQty:20,rating:5,sold:35,image:'https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=700',description:'Jasa editing video sesuai kebutuhan.'}
]);

function persist(){
put('bl_products',products);put('bl_categories',categories);put('bl_banners',banners);put('bl_orders',orders);put('bl_settings',settings);
}

/* DATABASE MEDIA - INDEXEDDB */
function openMediaDB(){
return new Promise((resolve,reject)=>{
let request=indexedDB.open('BLIYO_MARKET_MEDIA',1);
request.onupgradeneeded=()=>{let db=request.result;if(!db.objectStoreNames.contains('media'))db.createObjectStore('media')};
request.onsuccess=()=>{mediaDB=request.result;resolve(mediaDB)};
request.onerror=()=>reject(request.error);
});
}
function saveMedia(key,file){
return new Promise((resolve,reject)=>{
if(!mediaDB)return reject('Database belum siap.');
let tx=mediaDB.transaction('media','readwrite');tx.objectStore('media').put(file,key);
tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);
});
}
function readMedia(key){
return new Promise((resolve,reject)=>{
if(!mediaDB)return resolve(null);
let tx=mediaDB.transaction('media','readonly'),req=tx.objectStore('media').get(key);
req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
});
}
function deleteMedia(key){
return new Promise((resolve,reject)=>{
if(!mediaDB)return resolve();
let tx=mediaDB.transaction('media','readwrite');tx.objectStore('media').delete(key);
tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
});
}
function mediaURL(key){return key&&mediaCache[key]?mediaCache[key]:''}
async function loadMedia(key){
if(!key)return '';
if(mediaCache[key])return mediaCache[key];
try{
let blob=await readMedia(key);
if(!blob)return '';
let url=URL.createObjectURL(blob);
mediaCache[key]=url;
return url;
}catch{return ''}
}
function newMediaKey(){return 'blmedia_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function isImageFile(file){
return !!file&&(file.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(file.name||''));
}
async function uploadMedia(file){
if(!file)return null;
if(file.size>MAX_MEDIA){toast('Ukuran file maksimal 25 MB.');return null}
if(!isImageFile(file)){toast('File harus berupa gambar atau GIF.');return null}
let key=newMediaKey();
try{await saveMedia(key,file);return key}catch(e){toast('Gagal menyimpan file. Periksa kapasitas penyimpanan browser.');return null}
}
function safeLink(value){
let v=String(value||'').trim();
if(!v)return '';
if(/^https?:\/\//i.test(v)||v.startsWith('/')||v.startsWith('#'))return v;
return '';
}
function productImage(p){return (p?.imageKey&&mediaURL(p.imageKey))||p?.image||'https://placehold.co/700x450/e9edf3/66768b?text=BLIYO+MARKET'}
function bannerSource(b){return typeof b==='string'?b:(b?.key?mediaURL(b.key):b?.image||'')}
function bannerLink(b){return typeof b==='object'?safeLink(b.link):''}

/* ROUTING */
const routeNames={home:'home',categories:'categories',products:'products',history:'history',profile:'profile',login:'login',register:'register',editprofile:'editprofile',password:'password',admin:'admin',search:'search'};
function pageFromURL(){
let path=location.pathname.split('/').filter(Boolean).pop();
if(routeNames[path])return path;
let hash=location.hash.replace('#','').split('?')[0];
if(routeNames[hash])return hash;
return 'home';
}
function navigate(page){
if(!routeNames[page])page='home';
current=page;
try{history.pushState({page},'','/'+page)}catch{history.pushState({page},'','#'+page)}
render();window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('popstate',e=>{
current=e.state?.page||pageFromURL();adminTab=e.state?.adminTab||adminTab;render();
});
function greeting(){
let h=Number(new Intl.DateTimeFormat('id-ID',{hour:'numeric',hour12:false,timeZone:'Asia/Jakarta'}).format(new Date()));
let g=h>=4&&h<11?'Selamat pagi':h>=11&&h<15?'Selamat siang':h>=15&&h<18?'Selamat sore':'Selamat malam';
let t=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}).format(new Date());
return g+' · '+t+' WIB · Asia/Jakarta';
}

function makeOrderId(){let id;do{id='BYO'+String(Math.floor(100000+Math.random()*900000))}while(orders.some(o=>o.id===id));return id}

selectedProduct=products.find(p=>p.id===id);if(!selectedProduct)return;
if(!user){toast('Login dahulu sebelum memesan.');navigate('login');return}
let p=selectedProduct,min=Math.max(1,Number(p.minQty)||1),max=Math.max(min,Number(p.maxQty)||99);
$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">
<div class="row"><div><div class="eyebrow">DETAIL PEMESANAN</div><h2 style="margin-top:5px">Konfirmasi produk</h2></div><button class="modal-close" onclick="closeModal()">✕</button></div>
<img class="modal-image" src="${esc(productImage(p))}">

<p class="modal-description" style="margin-top:7px">${esc(p.description)}</p>
<div class="row" style="margin-top:15px"><span class="muted">Harga satuan</span><strong>${money(p.price)}</strong></div>
<div class="field"><label>Jumlah pembelian</label><div class="quantity"><button onclick="changeQty(-1)">−</button><input id="buyerQty" type="number" inputmode="numeric" min="${min}" max="${max}" value="${min}" oninput="updateTotal()" onblur="normalizeQty()"><button onclick="changeQty(1)">+</button></div><p class="muted" style="margin-top:7px">Minimal ${min} · Maksimal ${max}</p></div>
<div class="row" style="margin-top:16px;padding:14px;background:var(--glass);border-radius:13px"><strong>Total pembayaran</strong><strong id="buyTotal">${money(p.price*min)}</strong></div>
<div class="field"><label>Pesan tambahan (opsional)</label><textarea id="extraMessage" placeholder="Tuliskan pesan, pertanyaan, atau permintaan khusus..."></textarea></div>
<button class="primary" style="width:100%;margin-top:17px" onclick="sendWhatsApp()">Lanjut ke WhatsApp</button>
<p class="muted" style="text-align:center;margin-top:11px">Kamu akan diarahkan langsung ke WhatsApp admin.</p>
</div></div>`;
}
function getQty(){let val=$('#buyerQty')?.value;if(val===''||val===undefined)return null;let n=Number(val);return Number.isInteger(n)?n:null}
function changeQty(step){
let input=$('#buyerQty');if(!input)return;
let min=Math.max(1,Number(selectedProduct.minQty)||1),max=Math.max(min,Number(selectedProduct.maxQty)||99),n=getQty();
input.value=Math.min(max,Math.max(min,(n===null?min:n)+step));updateTotal();
}
function normalizeQty(){
let input=$('#buyerQty');if(!input)return;
let min=Math.max(1,Number(selectedProduct.minQty)||1),max=Math.max(min,Number(selectedProduct.maxQty)||99),n=getQty();
input.value=Math.max(min,Math.min(max,n===null?min:n));updateTotal();
}
function updateTotal(){
let qty=getQty(),total=$('#buyTotal');if(!total||!selectedProduct)return;
total.textContent=qty===null?'Masukkan jumlah':money(selectedProduct.price*qty);
}
function sendWhatsApp(){
let p=selectedProduct;if(!p)return;
let qty=getQty(),min=Math.max(1,Number(p.minQty)||1),max=Math.max(min,Number(p.maxQty)||99);
if(qty===null||qty<min||qty>max)return toast(`Jumlah harus ${min} sampai ${max}.`);
if(!settings.phone)return toast('Nomor WhatsApp admin belum diatur.');
let orderId=makeOrderId(),total=p.price*qty,additional=$('#extraMessage')?.value.trim()||'';
orders.unshift({id:orderId,name:user.name,email:user.email,product:p.name,price:p.price,qty,total,status:'Menunggu',date:new Date().toLocaleString('id-ID'),message:additional});
p.sold=(p.sold||0)+qty;persist();
let message=`Halo Admin BLIYO MARKET! 👋

Saya ingin melakukan pemesanan produk di BLIYO MARKET. Berikut adalah detail pesanan saya:

Detail Pemesanan
Nama: ${user.name}
Email: ${user.email}
Produk: ${p.name}
Harga: ${money(p.price)}
Jumlah: ${qty}`+(additional?`\n\n> Pesan Tambahan:\n\n${additional}`:'')+`\n\nMohon bantuannya untuk memproses pesanan saya. Terima kasih atas perhatian dan pelayanannya, Admin! 🙏`;
let phone=settings.phone.replace(/\D/g,''),url='https://wa.me/'+phone+'?text='+encodeURIComponent(message);
closeModal();window.location.href=url;
}

/* CAPTCHA */
let captchaTimer;
function newCaptcha(){
clearInterval(captchaTimer);captcha.code=String(Math.floor(100000+Math.random()*900000));captcha.expires=Date.now()+60000;updateCaptcha();
captchaTimer=setInterval(()=>{if(Date.now()>=captcha.expires){clearInterval(captchaTimer);captcha.code='';updateCaptcha()}else updateCaptcha()},1000);
}
function updateCaptcha(){
let code=$('#captchaCode'),time=$('#captchaTimer');if(code)code.textContent=captcha.code||'------';
if(time){let sec=Math.max(0,Math.ceil((captcha.expires-Date.now())/1000));time.textContent=captcha.code?`Berlaku ${sec} detik`:'Kode kedaluwarsa'}
}
function checkCaptcha(){
let entered=$('#captchaInput')?.value.trim();
if(!captcha.code||Date.now()>=captcha.expires){toast('Captcha kedaluwarsa.');newCaptcha();return false}
if(entered!==captcha.code){toast('Captcha tidak sesuai.');return false}return true;
}
function captchaHTML(){
return `<div class="field"><label>Captcha</label><div class="row" style="background:var(--glass);padding:12px;border-radius:13px"><strong id="captchaCode" style="font-size:21px;letter-spacing:6px">------</strong><div><span class="muted" id="captchaTimer"></span><button type="button" class="btn" onclick="newCaptcha()">↻</button></div></div><input id="captchaInput" inputmode="numeric" maxlength="6" placeholder="Masukkan 6 digit kode" style="margin-top:9px"></div>`;
}

/* LOGIN - RESTORE AVATAR DAN BANNER */
async function login(){
if(!checkCaptcha())return;
let email=$('#loginEmail').value.trim().toLowerCase(),pass=$('#loginPassword').value;

if(email===adminCredentials.email.toLowerCase()&&pass===adminCredentials.password){
user={name:'Administrator',email:adminCredentials.email,role:'admin'};
put('bl_user',user);
setSession();
await restoreProfileMedia();
clearInterval(captchaTimer);
navigate('home');
toast('Login admin berhasil!');
return;
}

let users=get('bl_users',[]),found=users.find(u=>u.email===email&&u.password===pass);
if(!found)return toast('Email atau password salah.');

user={
name:found.name,
email:found.email,
photoKey:found.photoKey||'',
coverKey:found.coverKey||'',
role:found.role||'user'
};

put('bl_user',user);
setSession();

/* Pulihkan gambar dari IndexedDB sebelum halaman dibuka */
await restoreProfileMedia();

clearInterval(captchaTimer);
navigate('home');
toast('Berhasil login! Avatar dan banner berhasil dipulihkan.');
}

function setSession(){
if($('#remember')?.checked)localStorage.setItem('bl_exp',Date.now()+2592000000);
else{sessionStorage.setItem('bl_user',JSON.stringify(user));localStorage.removeItem('bl_exp')}
}
function register(){
if(!checkCaptcha())return;
let name=$('#regName').value.trim(),email=$('#regEmail').value.trim().toLowerCase(),password=$('#regPassword').value;
if(!name||!email||!email.includes('@')||password.length<6)return toast('Periksa kembali data pendaftaran.');
let users=get('bl_users',[]);if(users.some(u=>u.email===email))return toast('Email sudah terdaftar.');
users.push({name,email,password,photoKey:'',coverKey:''});put('bl_users',users);
user={name,email,role:'user',photoKey:'',coverKey:''};
put('bl_user',user);
saveLastProfile();
clearInterval(captchaTimer);navigate('home');toast('Akun berhasil dibuat!');
}

async function changePhoto(input){
let f=input.files[0];if(!f)return;
if(f.size>MAX_MEDIA)return toast('Avatar maksimal 25 MB.');
if(!isImageFile(f))return toast('Pilih file gambar atau GIF.');
let key=await uploadMedia(f);if(!key)return;

let oldKey=user.photoKey;
user.photoKey=key;
put('bl_user',user);
saveAccountProfile();

let url=await loadMedia(key);
if($('#photoPreview'))$('#photoPreview').src=url;
if($('#photoLargePreview'))$('#photoLargePreview').src=url;

/* Jangan menghapus file lama saat profil masih memiliki referensi */
if(oldKey&&!oldKey.includes('')){}
toast('Avatar berhasil diperbarui.');
}

async function changeCover(input){
let f=input.files[0];if(!f)return;
if(f.size>MAX_MEDIA)return toast('Banner maksimal 25 MB.');
if(!isImageFile(f))return toast('Pilih file gambar atau GIF.');
let key=await uploadMedia(f);if(!key)return;

let oldKey=user.coverKey;
user.coverKey=key;
put('bl_user',user);
saveAccountProfile();

let url=await loadMedia(key);
if($('#coverPreview'))$('#coverPreview').src=url;

toast('Banner profil berhasil diperbarui.');
}

function saveProfile(){

user.name=name;

if(u){u.name=name;u.photoKey=user.photoKey||u.photoKey||'';u.coverKey=user.coverKey||u.coverKey||'';put('bl_users',users)}

saveLastProfile();
toast('Profil disimpan.');navigate('profile');
}

function openStatusPicker(id){openPicker('Status pesanan',['Menunggu','Selesai','Ditolak'].map(s=>({label:s,value:s})),s=>setStatus(id,s))}
async function saveProduct(){
let id=Number($('#pId').value),name=$('#pName').value.trim(),price=Number($('#pPrice').value);
let min=Number($('#pMin').value),max=Number($('#pMax').value);
if(!name||!$('#pPrice').value||price<0)return toast('Lengkapi nama dan harga produk.');
if(!Number.isInteger(min)||!Number.isInteger(max)||min<1||max<min)return toast('Batas jumlah produk tidak valid.');
if(!$('#pCategory').value)return toast('Pilih kategori produk.');
let old=id?products.find(p=>p.id===id):null;
let imageKey=old?.imageKey||'',image=$('#pImageUrl').value.trim()||old?.image||'';
let file=$('#pImageFile')?.files?.[0];
if(file){
let newKey=await uploadMedia(file);if(!newKey)return;
if(imageKey)await deleteMedia(imageKey);
imageKey=newKey;image='';
}
let data={name,category:$('#pCategory').value,price,minQty:min,maxQty:max,rating:Math.max(0,Math.min(5,Number($('#pRating').value)||5)),description:$('#pDesc').value.trim(),image,imageKey};
if(old){Object.assign(old,data);toast('Produk berhasil diperbarui.')}
else{products.unshift({id:Date.now(),...data,sold:0});toast('Produk berhasil ditambahkan.')}
persist();render();
}
function editProduct(id){
let p=products.find(x=>x.id===id);if(!p)return;
$('#pId').value=p.id;$('#pName').value=p.name;$('#pCategory').value=p.category;$('#pCategoryLabel').textContent=p.category;
$('#pPrice').value=p.price;$('#pMin').value=p.minQty||1;$('#pMax').value=p.maxQty||99;
$('#pRating').value=p.rating;$('#pDesc').value=p.description;
$('#pImageUrl').value=p.image||'';
$('#pImagePreview').src=productImage(p);
$('#pImageFile').value='';
window.scrollTo({top:0,behavior:'smooth'});
}
function resetProductForm(){
['pId','pName','pPrice','pDesc','pImageUrl','pCategory'].forEach(id=>$('#'+id).value='');
$('#pCategoryLabel').textContent='Pilih kategori ▾';
$('#pRating').value=5;$('#pMin').value=1;$('#pMax').value=99;
$('#pImageFile').value='';$('#pImagePreview').src='https://placehold.co/700x350/e9edf3/66768b?text=Preview+Produk';
}
function deleteProduct(id){
confirmDialog('Hapus produk?','Produk ini akan dihapus dari daftar toko.',async()=>{
let p=products.find(x=>x.id===id);
products=products.filter(p=>p.id!==id);
if(p?.imageKey)await deleteMedia(p.imageKey);
persist();render();toast('Produk berhasil dihapus.');
});
}
function addCategory(){
let c=$('#catName').value.trim();if(!c)return toast('Masukkan nama kategori.');
if(categories.includes(c))return toast('Kategori sudah ada.');
categories.push(c);persist();render();toast('Kategori ditambahkan.');
}
function deleteCategory(c){
confirmDialog('Hapus kategori?','Kategori '+c+' akan dihapus.',()=>{
categories=categories.filter(x=>x!==c);persist();render();toast('Kategori dihapus.');
});
}
async function addBanner(){
let file=$('#bannerFile')?.files?.[0],url=$('#bannerImageUrl')?.value.trim()||'',link=safeLink($('#bannerLinkInput')?.value);
if(!file&&!url)return toast('Pilih gambar atau masukkan URL gambar.');
let item={key:'',image:'',link};
if(file){
let key=await uploadMedia(file);if(!key)return;
item.key=key;await loadMedia(key);
}else item.image=url;
banners.push(item);persist();render();toast('Banner berhasil ditambahkan.');
}
function deleteBanner(i){
confirmDialog('Hapus banner?','Banner ini tidak akan ditampilkan lagi.',async()=>{
let b=banners[i];if(b&&typeof b==='object'&&b.key){
await deleteMedia(b.key);
if(mediaCache[b.key]){URL.revokeObjectURL(mediaCache[b.key]);delete mediaCache[b.key]}
}
banners.splice(i,1);bannerIndex=0;persist();render();toast('Banner dihapus.');
});
}
function setStatus(id,status){let o=orders.find(x=>x.id===id);if(o)o.status=status;persist();render();toast('Status pesanan diperbarui.')}
function saveSettings(){
let phone=$('#storePhone').value.trim().replace(/\D/g,'');
if(!phone)return toast('Nomor WhatsApp wajib diisi.');
settings.store=$('#storeName').value.trim()||'BLIYO MARKET';settings.phone=phone;
persist();toast('Pengaturan berhasil disimpan.');
}

/* RENDER */
function render(){
clearInterval(bannerTimer);clearTimeout(bannerTransitionTimer);
let token=++pageToken,isAdmin=current==='admin';
$('#bottomNav').classList.toggle('hidden',isAdmin);
document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active',el.dataset.page===current));
$('#view').innerHTML=skeletonHTML();
requestAnimationFrame(()=>{
if(token!==pageToken)return;
requestAnimationFrame(()=>{
if(token!==pageToken)return;
let pages={home:homePage,categories:categoriesPage,products:productsPage,history:historyPage,profile:profilePage,login:loginPage,register:registerPage,editprofile:editProfilePage,password:passwordPage,admin:renderAdmin,search:searchPage};
$('#view').innerHTML=(pages[current]||homePage)();
$('#view').classList.remove('page-enter');void $('#view').offsetWidth;$('#view').classList.add('page-enter');
if(current==='home')startBanners();
if(current==='login'||current==='register')newCaptcha();
});
});
}

/* SESSION */
async function init(){
try{await openMediaDB()}catch(e){console.error('Media DB:',e)}

let expiry=Number(localStorage.getItem('bl_exp')||0);
if(expiry&&expiry<Date.now()){
/* Akhiri sesi tanpa menghapus data akun atau gambar */
if(user){
saveLastProfile();
}
user=null;
localStorage.removeItem('bl_user');
localStorage.removeItem('bl_exp');
}

if(sessionStorage.getItem('bl_user')){
try{
user=JSON.parse(sessionStorage.getItem('bl_user'));
}catch{}
}

/* Pulihkan media profil yang sedang login */
if(user){
await restoreProfileMedia();
}else{
/* Pulihkan foto profil terakhir untuk tampilan saat logout */
await restoreLastProfileMedia();
}

for(let p of products){if(p.imageKey)await loadMedia(p.imageKey)}
for(let b of banners){if(b&&typeof b==='object'&&b.key)await loadMedia(b.key)}

current=pageFromURL();
if(!user&&current==='admin')current='home';
history.replaceState({page:current},'','/'+current);
render();
}
init();
</script>
</body>
</html>
